name: Publish to Docker Hub

# Mirrors the multi-arch image build.yml pushed to GHCR over to Docker
# Hub — a registry-to-registry manifest copy, no rebuild. This replaced
# build.yml's in-workflow Docker Hub push, whose token had insufficient
# scopes and failed every run. Credentials are the repo secrets
# dockerhub_username / dockerhub_password (a Docker Hub access token
# with Read & Write scope also works as the password).

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR tag to mirror (e.g. 2.0.0 or latest)"
        default: "latest"

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror GHCR -> Docker Hub
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/${{ secrets.dockerhub_username }}/ratioreign
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password }}

      - name: Mirror tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tags=()
          if [ -n "$INPUT_TAG" ]; then
            tags+=("$INPUT_TAG")
          else
            tags+=("sha-${HEAD_SHA:0:7}")
            if [ "$HEAD_BRANCH" = "main" ]; then
              tags+=("latest")
            elif [[ "$HEAD_BRANCH" =~ ^v[0-9] ]]; then
              version="${HEAD_BRANCH#v}"
              tags+=("$version" "${version%.*}" "latest")
            fi
          fi
          for tag in "${tags[@]}"; do
            if docker buildx imagetools inspect "$GHCR_IMAGE:$tag" > /dev/null 2>&1; then
              echo "Mirroring $GHCR_IMAGE:$tag -> $DOCKERHUB_IMAGE:$tag"
              docker buildx imagetools create -t "$DOCKERHUB_IMAGE:$tag" "$GHCR_IMAGE:$tag"
            else
              echo "Skipping $tag (not present on GHCR)"
            fi
          done

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password }}
          repository: ${{ secrets.dockerhub_username }}/ratioreign
          short-description: Headless BitTorrent ratio-farming daemon. Announces to private trackers without transferring data.
          readme-filepath: docs/dockerhub.md
