---
# Codacy's bundled trivy engine needs pattern configuration that only
# exists for a repo registered on codacy.com — without it, it crashes
# ("Failed to configure Codacy Trivy: no patterns configured") and corrupts
# the combined SARIF output. Disabled here since container/dependency
# vulnerability scanning is already covered by the dedicated Trivy workflow
# (.github/workflows/trivy.yml, aquasecurity/trivy-action) and CodeQL.
engines:
  trivy:
    enabled: false
