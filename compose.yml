services:
  ratioreign:
    build:
      context: .
      dockerfile: Containerfile
    image: ratioreign:latest
    container_name: ratioreign
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./profiles:/app/profiles:ro
